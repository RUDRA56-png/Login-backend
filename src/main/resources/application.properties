spring.application.name=registration-login-service
server.port=8080

# ---- Database (default: in-memory H2, zero setup). For MySQL run with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT (override the secret with the JWT_SECRET environment variable; min 32 characters)
app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-min-32-chars!!}
app.jwt.expiration-minutes=60

# ---- OTP / password reset
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.reset-token.expiry-minutes=10

# ---- CORS: frontend origins allowed to call this API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Email (OTP delivery). Default OFF: OTP is printed in the console instead.
# Enable with env vars: MAIL_ENABLED=true MAIL_USERNAME=you@gmail.com MAIL_PASSWORD=<gmail app password>
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@example.com}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
